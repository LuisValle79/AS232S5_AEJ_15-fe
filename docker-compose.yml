version: '3.8'

services:
  frontend-movies-jobs:
    container_name: frontend-movies-jobs

    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BACKEND_PORT=${BACKEND_PORT}

    ports:
      - "${FRONTEND_PORT}:80"

    environment:
      - TZ=${TZ}
      - BACKEND_PORT=${BACKEND_PORT}

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - fullstack-network

networks:
  fullstack-network:
    external: true
