# Docker Compose para Front-End de Movies & Jobs
# Proyecto: React + Vite con conexión a Spring Boot Backend
# Autor: Luis Valle

version: '3.8'

services:
  # Servicio del Front-End
  frontend-movies-jobs:
    # Nombre del contenedor
    container_name: frontend-movies-jobs
    
    # Construcción desde Dockerfile local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    
    # Imagen (opcional, para subir a Docker Hub después)
    # image: luisvalle1/frontend-movies-jobs:latest
    
    # Puerto de ejecución configurable mediante variables de entorno
    # Formato: HOST_PORT:CONTAINER_PORT
    ports:
      - "${FRONTEND_PORT}:80"
    
    # Variables de entorno para configuración
    environment:
      - TZ=${TZ}
      - VITE_API_URL=${VITE_API_URL}
    
    # Reinicio automático en caso de fallo
    restart: unless-stopped
    
    # Health check para verificar que el servicio está funcionando
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    
    # Red personalizada para comunicación con el backend
    networks:
      - fullstack-network

# Definición de redes
networks:
  fullstack-network:
    driver: bridge

# ============================================
# INSTRUCCIONES DE USO
# ============================================
#
# 1. Construir y levantar el contenedor:
#    docker-compose up -d --build
#
# 2. Ver logs del contenedor:
#    docker-compose logs -f frontend-movies-jobs
#
# 3. Detener el contenedor:
#    docker-compose down
#
# 4. Reconstruir la imagen:
#    docker-compose build --no-cache
#
# 5. Acceder a la aplicación:
#    http://localhost:3000
#
# ============================================
# COMUNICACIÓN CON EL BACKEND
# ============================================
#
# Para conectar el frontend con el backend, ambos deben estar
# en la misma red de Docker. Tienes dos opciones:
#
# OPCIÓN 1: Usar un docker-compose.yml unificado (RECOMENDADO)
# OPCIÓN 2: Conectar ambos contenedores a una red externa
#
# Ver archivo: docker-compose.fullstack.yml para la opción 1
#
